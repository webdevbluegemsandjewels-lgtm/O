<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM Dashboard</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="https://i.ibb.co/HWQvD5t/cropped-circle-image.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#16140f; --ink-soft:#6b6659; --line:#e4ded0; --gold:#a9824c;
    --emerald:#4a7c59; --paper:#faf8f3; --danger:#a9432f;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); }

  /* ---- Login gate ---- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .login-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:2.2rem 2rem; width:100%; max-width:360px; box-shadow:0 16px 36px rgba(22,20,15,.08); }
  .login-card h1{ font-size:1.15rem; margin:0 0 1.4rem; }
  .login-field{ margin-bottom:1rem; }
  .login-field label{ display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:.35rem; }
  .login-field input{ width:100%; border:1.5px solid #cfc7b6; border-radius:8px; padding:.65rem .8rem; font-size:.92rem; font-family:inherit; }
  .login-field input:focus{ outline:none; border-color:var(--gold); }
  .login-btn{ width:100%; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:.75rem; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:.4rem; }
  .login-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .login-error{ color:var(--danger); font-size:.82rem; margin:.7rem 0 0; display:none; }

  /* ---- Dashboard ---- */
  .dash{ display:none; max-width:1180px; margin:0 auto; padding:1.8rem 1.4rem 4rem; }
  .dash-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem; flex-wrap:wrap; gap:.8rem; }
  .dash-top h1{ font-size:1.3rem; margin:0; letter-spacing:.02em; }
  .logout-btn{ background:none; border:1px solid var(--line); border-radius:8px; padding:.5rem 1rem; font-size:.82rem; cursor:pointer; color:var(--ink-soft); }

  .filter-row{ display:flex; gap:.7rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .filter-row input{ flex:1; min-width:220px; border:1.5px solid #cfc7b6; border-radius:8px; padding:.6rem .8rem; font-size:.88rem; font-family:inherit; }
  .filter-row input:focus{ outline:none; border-color:var(--gold); }
  .download-btn{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:.6rem 1.1rem; font-size:.82rem; cursor:pointer; color:var(--ink); font-weight:600; }

  .table-card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:1.6rem; }
  table{ width:100%; border-collapse:collapse; font-size:.85rem; }
  thead th{ text-align:left; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); padding:.8rem 1rem; border-bottom:1px solid var(--line); background:#f7f4ec; }
  tbody td{ padding:.75rem 1rem; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .12s; }
  tbody tr:hover{ background:#faf6ec; }
  tbody tr.active-row{ background:#f3ecd9; }
  .status-pill{ display:inline-block; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:.28rem .6rem; border-radius:999px; }
  .status-paid{ background:#eaf1ec; color:var(--emerald); }
  .status-pending{ background:#faf3e2; color:#9c6f1e; }
  .status-failed, .status-cancelled{ background:#f7e9e6; color:var(--danger); }
  .details-link{ color:var(--gold); font-weight:600; white-space:nowrap; }
  .empty-row td{ text-align:center; color:var(--ink-soft); padding:2.4rem 1rem; }

  .pagination-row{ display:flex; align-items:center; justify-content:space-between; margin:-.7rem 0 1.6rem; font-size:.82rem; color:var(--ink-soft); }
  .page-btn{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:.45rem .9rem; font-size:.8rem; cursor:pointer; color:var(--ink); font-weight:600; }
  .page-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .page-buttons{ display:flex; gap:.6rem; }

  .detail-panel{ display:none; }
  .detail-topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.8rem; margin-bottom:1rem; }
  .detail-topbar .order-tag{ font-weight:700; font-size:1.05rem; }
  .detail-topbar .actions{ display:flex; gap:.6rem; }
  .action-btn{ border-radius:8px; padding:.45rem .95rem; font-size:.78rem; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .action-btn.edit-btn{ color:var(--gold); border-color:rgba(169,130,76,.4); }
  .action-btn.delete-btn{ color:var(--danger); border-color:rgba(169,67,47,.35); }

  .client-name-bar{ background:#f7f4ec; border:1px solid var(--line); border-radius:6px; padding:.55rem .9rem; font-size:.82rem; margin-bottom:1rem; text-align:center; }

  .detail-grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:1.2rem; }
  .detail-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:1.3rem 1.4rem; }
  .detail-box h3{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 1rem; }
  .detail-box .item{ padding:.6rem 0; border-top:1px solid var(--line); font-size:.85rem; line-height:1.7; }
  .detail-box .item:first-of-type{ border-top:none; padding-top:0; }
  .detail-box .item b{ display:block; color:var(--ink); }
  .detail-box .item span{ color:var(--ink-soft); }
  .amount-line{ display:flex; justify-content:space-between; font-size:.9rem; padding:.5rem 0; }
  .amount-line.total{ font-weight:700; font-size:1.05rem; border-top:1px solid var(--line); margin-top:.4rem; padding-top:.8rem; }

  .product-card{ display:grid; grid-template-columns:120px 1fr; border:1px solid var(--ink); border-radius:6px; overflow:hidden; margin-bottom:1rem; }
  .product-card + .product-card{ margin-top:1rem; }
  .product-card .img-cell{ grid-row:1 / -1; border-right:1px solid var(--ink); background:#f7f4ec; align-self:stretch; }
  .product-card .img-cell img{ display:block; width:100%; height:100%; min-height:130px; object-fit:cover; }
  .product-card .img-cell .no-img{ height:100%; min-height:130px; display:flex; align-items:center; justify-content:center; font-size:.68rem; color:var(--ink-soft); text-align:center; }
  .product-card .spec-rows{ display:flex; flex-direction:column; }
  .product-card .spec-row{ display:flex; border-bottom:1px solid var(--line); font-size:.78rem; }
  .product-card .spec-row:last-child{ border-bottom:none; }
  .product-card .spec-row .pair{ flex:1; display:flex; justify-content:space-between; gap:.5rem; padding:.4rem .6rem; }
  .product-card .spec-row .pair + .pair{ border-left:1px solid var(--line); }
  .product-card .spec-row .pair .lbl{ color:var(--ink-soft); }
  .product-card .spec-row .pair .val{ color:var(--ink); font-weight:600; text-align:right; }
  .product-card .spec-row.full .pair{ flex:1 1 100%; }

  .remark-box{ font-size:.82rem; color:var(--ink-soft); }
  .remark-box textarea{ width:100%; min-height:56px; border:1.5px solid #cfc7b6; border-radius:8px; padding:.6rem; font-family:inherit; font-size:.82rem; resize:vertical; }
  .status-select{ border:1.5px solid #cfc7b6; border-radius:8px; padding:.4rem .6rem; font-size:.82rem; font-family:inherit; }
  .save-btn{ background:var(--emerald); color:#fff; border:none; border-radius:8px; padding:.45rem 1rem; font-size:.8rem; font-weight:600; cursor:pointer; margin-top:.8rem; }

  @media (max-width:820px){
    .detail-grid{ grid-template-columns:1fr; }
    .table-card{ overflow-x:auto; }
    table{ min-width:700px; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>CRM Dashboard Login</h1>
    <form id="loginForm">
      <div class="login-field">
        <label>Admin Name</label>
        <input id="loginUser" type="text" autocomplete="username" required />
      </div>
      <div class="login-field">
        <label>Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Log in</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<div class="dash" id="dash">
  <div class="dash-top">
    <h1>CRM Dashboard</h1>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>

  <div class="filter-row">
    <input type="text" id="searchFilter" placeholder="Search by order no, customer name or product…" />
    <button class="download-btn" id="downloadBtn">Download CSV</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Order No</th>
          <th>Cust Name</th>
          <th>Product</th>
          <th>Status</th>
          <th>Date</th>
          <th>Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr class="empty-row"><td colspan="7">Loading orders…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-row" id="paginationRow" style="display:none;">
    <span id="pageLabel"></span>
    <div class="page-buttons">
      <button class="page-btn" id="prevPageBtn">Prev Page</button>
      <button class="page-btn" id="nextPageBtn">Next Page</button>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-topbar">
      <span class="order-tag">ORDER <b id="detailOrderId"></b></span>
      <div class="actions">
        <button class="action-btn" id="detailDownloadBtn">Download PDF</button>
        <button class="action-btn edit-btn" id="detailEditBtn">Edit</button>
        <button class="action-btn delete-btn" id="detailDeleteBtn">Delete</button>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-box" id="productDetailBox">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
          <h3 style="margin:0;">Product Details</h3>
          <button class="action-btn" id="productPdfBtn" data-html2canvas-ignore="true">Download as PDF</button>
        </div>
        <div class="client-name-bar">Client Name :- <b id="detailClientName"></b></div>
        <div id="detailProducts"></div>
        <div class="remark-box" id="remarkBox"></div>
      </div>
      <div class="detail-box">
        <h3>Customer Details</h3>
        <div id="detailCustomer"></div>
      </div>
      <div class="detail-box">
        <h3>Amount</h3>
        <div id="detailAmount"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
(function () {
  const loginWrap = document.getElementById("loginWrap");
  const dash = document.getElementById("dash");
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");

  let orders = [];
  let visibleOrders = [];
  let activeOrderId = null;
  let currentPage = 1;
  const ROWS_PER_PAGE = 10;
  let editMode = false;

  function money(n) {
    return `₹${Math.round(Number(n || 0)).toLocaleString("en-IN")}`;
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  const statusClass = { paid: "status-paid", pending: "status-pending", failed: "status-failed", cancelled: "status-cancelled" };
  const statusLabel = { paid: "Paid", pending: "Pending", failed: "Failed", cancelled: "Cancelled" };

  function credentials() {
    return {
      username: sessionStorage.getItem("crm_admin_user") || "",
      password: sessionStorage.getItem("crm_admin_pass") || "",
    };
  }

  async function crmRequest(body) {
    const { data, error } = await supabaseClient.functions.invoke("crm-orders", { body });
    if (error) throw new Error(error.message || "Request failed");
    if (data?.error) throw new Error(data.error);
    return data;
  }

  async function fetchOrders(username, password) {
    const data = await crmRequest({ username, password, action: "list" });
    return data.orders || [];
  }

  function renderTable(list) {
    visibleOrders = list;
    if (currentPage < 1) currentPage = 1;
    const totalPages = Math.max(1, Math.ceil(list.length / ROWS_PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * ROWS_PER_PAGE;
    const pageItems = list.slice(start, start + ROWS_PER_PAGE);

    const body = document.getElementById("ordersBody");
    if (!pageItems.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="7">No orders found.</td></tr>`;
    } else {
      body.innerHTML = pageItems.map((o) => {
        const productSummary = (o.items || []).map((i) => i.name).join(", ") || "—";
        const cls = statusClass[o.status] || "status-pending";
        const label = statusLabel[o.status] || o.status;
        return `
          <tr data-id="${o.id}" class="${o.id === activeOrderId ? "active-row" : ""}">
            <td>#${o.id.slice(0, 8).toUpperCase()}</td>
            <td>${escapeHtml(o.customer.name || "—")}</td>
            <td>${escapeHtml(productSummary)}</td>
            <td><span class="status-pill ${cls}">${label}</span></td>
            <td>${new Date(o.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</td>
            <td>${money(o.total)}</td>
            <td class="details-link">Details &rarr;</td>
          </tr>
        `;
      }).join("");

      body.querySelectorAll("tr[data-id]").forEach((row) => {
        row.addEventListener("click", () => showDetail(row.getAttribute("data-id")));
      });
    }

    const paginationRow = document.getElementById("paginationRow");
    if (!list.length) {
      paginationRow.style.display = "none";
    } else {
      paginationRow.style.display = "flex";
      const rangeStart = start + 1;
      const rangeEnd = Math.min(start + ROWS_PER_PAGE, list.length);
      document.getElementById("pageLabel").textContent = `Row ${rangeStart}-${rangeEnd} of ${list.length}`;
      document.getElementById("prevPageBtn").disabled = currentPage <= 1;
      document.getElementById("nextPageBtn").disabled = currentPage >= totalPages;
    }
  }

  function showDetail(orderId) {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    activeOrderId = orderId;
    editMode = false;

    document.querySelectorAll("#ordersBody tr").forEach((r) => r.classList.toggle("active-row", r.getAttribute("data-id") === orderId));

    document.getElementById("detailPanel").style.display = "block";
    document.getElementById("detailOrderId").textContent = `#${order.id.slice(0, 8).toUpperCase()}`;
    document.getElementById("detailClientName").textContent = order.customer.name || "—";

    renderProductBox(order);

    const c = order.customer;
    document.getElementById("detailCustomer").innerHTML = `
      <div class="item">
        <b>${escapeHtml(c.name || "—")}</b>
        <span>${escapeHtml(c.phone || "—")}</span>
      </div>
      <div class="item">
        <span>${escapeHtml(c.address || "—")}</span><br>
        <span>${[c.city, c.state, c.pincode].filter(Boolean).map(escapeHtml).join(", ")}</span>
      </div>
    `;

    renderAmountBox(order);
  }

  function renderProductBox(order) {
    const table = (order.items || []).length ? order.items.map((i) => `
      <div class="product-card">
        <div class="img-cell">
          ${i.image ? `<img src="${escapeHtml(i.image)}" alt="${escapeHtml(i.name)}">` : `<span class="no-img">Product Image</span>`}
        </div>
        <div class="spec-rows">
          <div class="spec-row">
            <span class="pair"><span class="lbl">QTY</span><span class="val">${i.quantity}</span></span>
            <span class="pair"><span class="lbl">Size</span><span class="val">${escapeHtml(i.size || "—")}</span></span>
          </div>
          <div class="spec-row full">
            <span class="pair"><span class="lbl">Gold Wt</span><span class="val">${i.gold_weight_grams != null ? i.gold_weight_grams + "g" : "—"}</span></span>
          </div>
          <div class="spec-row full">
            <span class="pair"><span class="lbl">Gold Karat</span><span class="val">${escapeHtml(i.metal_type || "—")}</span></span>
          </div>
          <div class="spec-row full">
            <span class="pair"><span class="lbl">Gross Wt</span><span class="val">—</span></span>
          </div>
          <div class="spec-row">
            <span class="pair"><span class="lbl">Diamonds</span><span class="val">—</span></span>
            <span class="pair"><span class="lbl"></span><span class="val">${i.diamond_weight_ct != null ? i.diamond_weight_ct + " ct" : "—"}</span></span>
          </div>
          ${i.diamond_quality ? `
          <div class="spec-row full">
            <span class="pair"><span class="lbl">Diamond Type &amp; Quality</span><span class="val">${escapeHtml(i.diamond_quality)}</span></span>
          </div>` : ""}
          <div class="spec-row">
            <span class="pair"><span class="lbl">Colour stone</span><span class="val">—</span></span>
            <span class="pair"><span class="lbl"></span><span class="val">—</span></span>
          </div>
          <div class="spec-row full">
            <span class="pair"><span class="lbl">Price</span><span class="val">${money(i.unit_price)}</span></span>
          </div>
        </div>
      </div>
    `).join("") : `<p style="color:var(--ink-soft); font-size:.85rem;">No items found.</p>`;

    const remarkHtml = editMode
      ? `<label style="display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:.4rem;">Special Remark</label>
         <textarea id="remarkInput">${escapeHtml(order.admin_notes || "")}</textarea>
         <label style="display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:.8rem 0 .4rem;">Status</label>
         <select class="status-select" id="statusInput">
           ${Object.keys(statusLabel).map((s) => `<option value="${s}" ${s === order.status ? "selected" : ""}>${statusLabel[s]}</option>`).join("")}
         </select>
         <br><button class="save-btn" id="saveEditBtn">Save Changes</button>`
      : `<b style="display:block; margin-bottom:.3rem;">Special Remark</b><span>${escapeHtml(order.admin_notes || "—")}</span>`;

    document.getElementById("detailProducts").innerHTML = table;
    document.getElementById("remarkBox").innerHTML = remarkHtml;

    if (editMode) {
      document.getElementById("saveEditBtn").addEventListener("click", () => saveEdit(order.id));
    }
  }

  function renderAmountBox(order) {
    const dispatchBy = new Date(order.created_at);
    dispatchBy.setDate(dispatchBy.getDate() + 7);
    const dispatchLabel = order.status === "paid"
      ? (new Date() >= dispatchBy ? "Dispatched" : `Dispatches by ${dispatchBy.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}`)
      : "Awaiting payment";

    document.getElementById("detailAmount").innerHTML = `
      <div class="amount-line"><span>Payment Status</span><span>${statusLabel[order.status] || order.status}</span></div>
      <div class="amount-line"><span>Dispatch</span><span>${dispatchLabel}</span></div>
      <div class="amount-line"><span>Razorpay Payment ID</span><span>${escapeHtml(order.razorpay_payment_id || "—")}</span></div>
      <div class="amount-line total"><span>Total Paid</span><span>${money(order.total)}</span></div>
    `;
  }

  async function saveEdit(orderId) {
    const saveBtn = document.getElementById("saveEditBtn");
    const status = document.getElementById("statusInput").value;
    const admin_notes = document.getElementById("remarkInput").value;
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      const { username, password } = credentials();
      await crmRequest({ username, password, action: "update", order_id: orderId, status, admin_notes });
      const order = orders.find((o) => o.id === orderId);
      order.status = status;
      order.admin_notes = admin_notes;
      editMode = false;
      renderProductBox(order);
      renderAmountBox(order);
      renderTable(visibleOrders);
    } catch (err) {
      alert(err.message || "Could not save changes");
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
    }
  }

  async function deleteActiveOrder() {
    if (!activeOrderId) return;
    if (!confirm("Delete this order permanently? This cannot be undone.")) return;
    try {
      const { username, password } = credentials();
      await crmRequest({ username, password, action: "delete", order_id: activeOrderId });
      orders = orders.filter((o) => o.id !== activeOrderId);
      activeOrderId = null;
      document.getElementById("detailPanel").style.display = "none";
      applyFilter();
    } catch (err) {
      alert(err.message || "Could not delete order");
    }
  }

  function downloadActiveOrder() {
    const order = orders.find((o) => o.id === activeOrderId);
    if (!order) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const orderTag = `#${order.id.slice(0, 8).toUpperCase()}`;

    doc.setFontSize(16);
    doc.text(`Order ${orderTag}`, 14, 18);
    doc.setFontSize(10);
    doc.setTextColor(110, 105, 90);
    doc.text(
      `${new Date(order.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}  •  ${statusLabel[order.status] || order.status}`,
      14, 25
    );
    doc.setTextColor(20, 20, 15);

    doc.autoTable({
      startY: 32,
      head: [["Product", "Qty", "Size", "Gold Wt", "Diamonds", "Price"]],
      body: (order.items || []).map((i) => [
        i.name,
        i.quantity,
        i.size || "—",
        i.gold_weight_grams != null ? i.gold_weight_grams + "g" : "—",
        i.diamond_weight_ct != null ? i.diamond_weight_ct + " ct" : "—",
        money(i.unit_price),
      ]),
      theme: "grid",
      headStyles: { fillColor: [169, 130, 76] },
      styles: { fontSize: 9 },
    });

    let y = doc.lastAutoTable.finalY + 10;
    if (order.admin_notes) {
      doc.setFontSize(10);
      doc.text("Special Remark:", 14, y);
      const remarkLines = doc.splitTextToSize(order.admin_notes, 180);
      doc.text(remarkLines, 14, y + 6);
      y += 6 + remarkLines.length * 5 + 6;
    }

    const c = order.customer;
    doc.autoTable({
      startY: y,
      head: [["Customer Details", ""]],
      body: [
        ["Name", c.name || "—"],
        ["Phone", c.phone || "—"],
        ["Address", [c.address, c.city, c.state, c.pincode].filter(Boolean).join(", ") || "—"],
      ],
      theme: "plain",
      styles: { fontSize: 9 },
      columnStyles: { 0: { fontStyle: "bold", cellWidth: 30 } },
    });

    y = doc.lastAutoTable.finalY + 6;
    const dispatchBy = new Date(order.created_at);
    dispatchBy.setDate(dispatchBy.getDate() + 7);
    const dispatchLabel = order.status === "paid"
      ? (new Date() >= dispatchBy ? "Dispatched" : `Dispatches by ${dispatchBy.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}`)
      : "Awaiting payment";

    doc.autoTable({
      startY: y,
      body: [
        ["Payment Status", statusLabel[order.status] || order.status],
        ["Dispatch", dispatchLabel],
        ["Razorpay Payment ID", order.razorpay_payment_id || "—"],
        ["Total Paid", money(order.total)],
      ],
      theme: "plain",
      styles: { fontSize: 9 },
      columnStyles: { 0: { fontStyle: "bold", cellWidth: 50 } },
    });

    doc.save(`order-${order.id.slice(0, 8)}.pdf`);
  }

  async function downloadProductDetailsPdf() {
    const order = orders.find((o) => o.id === activeOrderId);
    const box = document.getElementById("productDetailBox");
    if (!order || !box) return;

    const pdfBtn = document.getElementById("productPdfBtn");
    pdfBtn.disabled = true;
    const originalLabel = pdfBtn.textContent;
    pdfBtn.textContent = "Preparing…";

    try {
      const canvas = await html2canvas(box, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true,
        ignoreElements: (el) => el.hasAttribute && el.hasAttribute("data-html2canvas-ignore"),
      });

      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: canvas.width > canvas.height ? "landscape" : "portrait", unit: "pt" });

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 24;
      const maxWidth = pageWidth - margin * 2;
      const maxHeight = pageHeight - margin * 2;

      const ratio = Math.min(maxWidth / canvas.width, maxHeight / canvas.height);
      const imgWidth = canvas.width * ratio;
      const imgHeight = canvas.height * ratio;

      doc.addImage(imgData, "PNG", margin, margin, imgWidth, imgHeight);
      doc.save(`product-details-${order.id.slice(0, 8)}.pdf`);
    } catch (err) {
      alert("Could not generate PDF: " + (err.message || err));
    } finally {
      pdfBtn.disabled = false;
      pdfBtn.textContent = originalLabel;
    }
  }

  function applyFilter() {
    currentPage = 1;
    const q = document.getElementById("searchFilter").value.trim().toLowerCase();
    if (!q) { renderTable(orders); return; }
    const filtered = orders.filter((o) => {
      const productNames = (o.items || []).map((i) => i.name).join(" ").toLowerCase();
      return o.id.toLowerCase().includes(q)
        || (o.customer.name || "").toLowerCase().includes(q)
        || productNames.includes(q);
    });
    renderTable(filtered);
  }

  function downloadCsv() {
    const rows = [["Order No", "Customer Name", "Product", "Status", "Date", "Amount"]];
    orders.forEach((o) => {
      rows.push([
        `#${o.id.slice(0, 8).toUpperCase()}`,
        o.customer.name || "",
        (o.items || []).map((i) => i.name).join("; "),
        statusLabel[o.status] || o.status,
        new Date(o.created_at).toLocaleDateString("en-IN"),
        o.total,
      ]);
    });
    const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "orenkafine-orders.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  async function boot(username, password) {
    orders = await fetchOrders(username, password);
    loginWrap.style.display = "none";
    dash.style.display = "block";
    renderTable(orders);
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";

    const username = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPass").value;

    try {
      await boot(username, password);
      sessionStorage.setItem("crm_admin_user", username);
      sessionStorage.setItem("crm_admin_pass", password);
    } catch (err) {
      loginError.textContent = err.message || "Login failed";
      loginError.style.display = "block";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Log in";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem("crm_admin_user");
    sessionStorage.removeItem("crm_admin_pass");
    dash.style.display = "none";
    loginWrap.style.display = "flex";
    document.getElementById("loginPass").value = "";
  });

  document.getElementById("searchFilter").addEventListener("input", applyFilter);
  document.getElementById("downloadBtn").addEventListener("click", downloadCsv);

  document.getElementById("prevPageBtn").addEventListener("click", () => {
    currentPage -= 1;
    renderTable(visibleOrders);
  });
  document.getElementById("nextPageBtn").addEventListener("click", () => {
    currentPage += 1;
    renderTable(visibleOrders);
  });

  document.getElementById("detailEditBtn").addEventListener("click", () => {
    const order = orders.find((o) => o.id === activeOrderId);
    if (!order) return;
    editMode = !editMode;
    renderProductBox(order);
  });
  document.getElementById("detailDeleteBtn").addEventListener("click", deleteActiveOrder);
  document.getElementById("detailDownloadBtn").addEventListener("click", downloadActiveOrder);
  document.getElementById("productPdfBtn").addEventListener("click", downloadProductDetailsPdf);

  // Auto-login within the same tab session so a page refresh doesn't
  // force re-entering the password (cleared when the tab closes).
  (async () => {
    const savedUser = sessionStorage.getItem("crm_admin_user");
    const savedPass = sessionStorage.getItem("crm_admin_pass");
    if (savedUser && savedPass) {
      try { await boot(savedUser, savedPass); }
      catch { sessionStorage.removeItem("crm_admin_user"); sessionStorage.removeItem("crm_admin_pass"); }
    }
  })();
})();
</script>
</body>
</html>
